{% extends "base.html" %}{% block title %}Sign up — EventOps AI{% endblock %}{% block public %}
<div class="auth-page"><div class="auth-card"><div class="brand center"><span class="brand-mark">✦</span> EventOps <b>AI</b></div><h1>Create your workspace</h1><p>Set up your team and start your first event.</p>
<form method="post"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label>Organization / Team<input name="organization"></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn primary full">Create account</button></form>
